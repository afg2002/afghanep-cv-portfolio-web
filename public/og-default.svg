<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#14b8a6" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative teal accent lines -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>

  <!-- Subtle geometric circle -->
  <circle cx="1050" cy="315" r="220" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.12"/>
  <circle cx="1050" cy="315" r="160" fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.08"/>
  <circle cx="1050" cy="315" r="280" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.06"/>

  <!-- Small decorative dots -->
  <circle cx="950" cy="180" r="4" fill="#14b8a6" opacity="0.3"/>
  <circle cx="1150" cy="420" r="3" fill="#10b981" opacity="0.25"/>
  <circle cx="1000" cy="480" r="2" fill="#14b8a6" opacity="0.2"/>

  <!-- Name -->
  <text x="80" y="240" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="72" font-weight="700" fill="#e6edf3" letter-spacing="-1">AFGHAN EKA</text>
  <text x="80" y="320" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="72" font-weight="700" fill="#e6edf3" letter-spacing="-1">PANGESTU</text>

  <!-- Role -->
  <text x="80" y="380" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="32" font-weight="500" fill="#14b8a6" letter-spacing="2">SOFTWARE DEVELOPER</text>

  <!-- Divider -->
  <line x1="80" y1="420" x2="300" y2="420" stroke="#14b8a6" stroke-width="2" opacity="0.5"/>

  <!-- Tagline -->
  <text x="80" y="456" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="20" font-weight="400" fill="#8b949e">Web Applications &amp; API Developer</text>

  <!-- Domain -->
  <text x="80" y="500" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" font-weight="400" fill="#484f58">aep.my.id</text>

  <!-- Location badge -->
  <rect x="80" y="530" width="160" height="36" rx="18" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="160" y="554" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="500" fill="#8b949e" text-anchor="middle">📍 Bogor, Indonesia</text>
</svg>
